name: Build and push the docker image to ACR

on:
  push:
    branches:
      - "main"

env:
  IMAGE_REPOSITORY_NAME: brezyweather
  IMAGE_TAG: 1.0.0

jobs:
  Build:
    name: Build container image
    runs-on: ubuntu-latest

    steps:
      - name: setup a docker buildx
        uses: docker/setup-build-actions@v2

      - name: login to ACR
        uses: docker/login-actions@v1
        with:
          registry: ${{ secrets.ACR_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and Push the image
        uses: docker/build-push-actions@v2
        with:
          push: true
          tags: ${{ secrets.ACR_SERVER }}/${{ env.IMAGE_REPOSITORY_NAME }}:${{ env.IMAGE_TAG }}




        
    
    
